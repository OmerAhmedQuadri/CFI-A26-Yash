<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Dog</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.8.0/axios.min.js"></script>
</head>

<body>

    <div class="card">

        <img id="photo" src="images.webp" alt="Dog Image">

        <h1 id="name">Dog Name</h1>

        <div class="info">

            <div class="info-row">
                <span>Breed Group</span>
                <p id="breed">-</p>
            </div>

            <div class="info-row">
                <span>Bred For</span>
                <p id="bredfor">-</p>
            </div>

            <div class="info-row">
                <span>Life Span</span>
                <p id="lifespan">-</p>
            </div>

            <div class="info-row">
                <span>Temperament</span>
                <p id="tamperament">-</p>
            </div>

            <div class="info-row">
                <span>Height</span>
                <p id="height">-</p>
            </div>

            <div class="info-row">
                <span>Weight</span>
                <p id="weight">-</p>
            </div>

        </div>
        <button id="btn">Get Random Dog</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
