<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Tasky</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <h1>✓ Tasky</h1>
            <p>Organize your tasks, own your day.</p>
        </div>

        <form class="auth-form" id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                />
            </div>

            <!-- Error message shown when login fails -->
            <p id="error-msg" class="text-sm hidden" style="color: var(--color-danger);"></p>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="/register.html">Create one free</a>
        </div>
    </div>

    <!--
        INTERVIEW: Why is the script at the bottom of <body>?
        Scripts block HTML parsing. Placing them at the bottom ensures
        the DOM is fully built before our JS tries to find elements.
        Alternative: use defer attribute on <script>.
    -->
    <script src="auth.js"></script>
</body>
</html>
