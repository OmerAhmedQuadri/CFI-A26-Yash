<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Tasky</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">

    <!-- ── HEADER ──────────────────────────────────────────────── -->
    <header class="header">
        <div class="header-logo">
            ✓ Tasky
            <span id="header-greeting">Loading...</span>
        </div>
        <div class="header-user">
            <span class="header-user-name">Welcome, <strong id="user-name">...</strong></span>
            <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
        </div>
    </header>

    <!-- ── MAIN CONTENT ────────────────────────────────────────── -->
    <main class="main">

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <span class="stat-number" id="stat-total">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-active" style="color: var(--color-info);">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-completed" style="color: var(--color-success);">0</span>
                <span class="stat-label">Done</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-high" style="color: var(--color-danger);">0</span>
                <span class="stat-label">High Priority</span>
            </div>
        </div>

        <!-- Add Task Form -->
        <section class="add-task-section">
            <h2 class="section-title">+ Add New Task</h2>

            <form class="add-task-form" id="add-task-form" novalidate>
                <!-- Title spans full row via CSS grid -->
                <div class="form-group">
                    <label for="task-title">Task Title *</label>
                    <input
                        type="text"
                        id="task-title"
                        placeholder="What needs to be done?"
                        maxlength="200"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="task-due">Due Date</label>
                    <input type="date" id="task-due" />
                </div>

                <!-- Description spans full row -->
                <div class="form-group">
                    <label for="task-desc">Description (optional)</label>
                    <textarea
                        id="task-desc"
                        placeholder="Add details..."
                        maxlength="1000"
                        rows="2"
                    ></textarea>
                </div>

                <div class="add-task-actions">
                    <button type="submit" class="btn btn-primary" id="add-task-btn">
                        Add Task
                    </button>
                </div>
            </form>
        </section>

        <!-- Filter / Search Bar -->
        <section class="filter-section">
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="🔍 Search tasks..."
            />

            <select id="filter-status" class="filter-select">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>

            <select id="filter-priority" class="filter-select">
                <option value="all">All Priority</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <select id="filter-sort" class="filter-select">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="priority">By Priority</option>
                <option value="dueDate">By Due Date</option>
            </select>
        </section>

        <!-- Task List -->
        <section class="tasks-section">
            <div class="tasks-header">
                <span class="tasks-count" id="tasks-count">Loading tasks...</span>
            </div>

            <div id="tasks-list" class="tasks-list">
                <div class="loading-state">
                    <div class="loader"></div>
                    <p style="margin-top: 12px;">Loading your tasks...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- ── EDIT MODAL ───────────────────────────────────────────── -->
    <div class="modal-overlay hidden" id="edit-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="modal-close" id="modal-close-btn" aria-label="Close">&#x2715;</button>
            </div>

            <form class="modal-form" id="edit-task-form">
                <input type="hidden" id="edit-task-id" />

                <div class="form-group">
                    <label for="edit-title">Title *</label>
                    <input type="text" id="edit-title" maxlength="200" required />
                </div>

                <div class="form-group">
                    <label for="edit-priority">Priority</label>
                    <select id="edit-priority">
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit-due">Due Date</label>
                    <input type="date" id="edit-due" />
                </div>

                <div class="form-group">
                    <label for="edit-desc">Description</label>
                    <textarea id="edit-desc" rows="3" maxlength="1000"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="modal-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ── TOAST CONTAINER ─────────────────────────────────────── -->
    <!--
        INTERVIEW CONCEPT: Toast notifications are injected here via JS.
        We use a container div and append/remove elements dynamically.
        This is DOM manipulation — creating elements with JavaScript
        and adding/removing them from the DOM tree.
    -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
